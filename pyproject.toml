[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-contract-analyzer"
version = "1.0.0"
description = "AI-Powered Legal Document Analysis for Risk Detection and Clause Extraction"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nwaeke Calixtus Ifeanyi, Esq.", email = "calixtusnwaeke@gmail.com"}
]
keywords = ["legal", "nlp", "contract", "ai", "compliance", "legaltech", "regtech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Office/Business :: Legal",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "pdfplumber>=0.10.0",
    "pypdf>=3.8.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]
notebook = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/CalixtusDataSci/legal-contract-analyzer"
Repository = "https://github.com/CalixtusDataSci/legal-contract-analyzer"
Issues = "https://github.com/CalixtusDataSci/legal-contract-analyzer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
